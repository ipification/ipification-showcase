name: Showcase Next.js CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: showcase-next-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify main flows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
      - name: Install Next.js dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit and API tests
        run: npm test
      - name: Playwright main flows
        run: >-
          npm run test:e2e --
          e2e/main-flows.spec.ts
          e2e/sim-availability.spec.ts
          e2e/qr.spec.ts
          e2e/sms.spec.ts
          e2e/result.spec.ts
          e2e/auth-error.spec.ts
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-next-playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
