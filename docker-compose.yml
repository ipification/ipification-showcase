services:
  showcase-next:
    image: ipification_showcase_next:local
    build:
      context: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      APP_ENV: ${SHOWCASE_APP_ENV:-stage}
      NODE_CONFIG_ENV: ${SHOWCASE_APP_ENV:-stage}
      NODE_CONFIG_DIR: /run/showcase-config
      TRUST_PROXY_HOPS: ${SHOWCASE_TRUST_PROXY_HOPS:-0}
      PORT: 3002
    ports:
      - '3002:3002'
    volumes:
      - type: bind
        source: ./config/default.json
        target: /run/showcase-config/default.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3002/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 15s
